<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Construct Mind</title>
    <script>
      // Keep reference to original console functions to prevent recursive loops or missing logs
      const originalConsoleError = console.error;
      const originalConsoleWarn = console.warn;

      const isBenignError = (msg) => {
        if (!msg) return false;
        const msgStr = String(msg).toLowerCase();
        return (
          msgStr.includes('websocket') ||
          msgStr.includes('web-ifc') ||
          msgStr.includes('vite') ||
          msgStr.includes('script error')
        );
      };

      console.error = function (...args) {
        if (args.some(arg => isBenignError(arg) || (arg && isBenignError(arg.message)))) {
          // Suppress benign connection errors
          return;
        }
        originalConsoleError.apply(console, args);
      };

      console.warn = function (...args) {
        if (args.some(arg => isBenignError(arg) || (arg && isBenignError(arg.message)))) {
          // Suppress benign warnings
          return;
        }
        originalConsoleWarn.apply(console, args);
      };

      // Suppress benign WebSocket/HMR connection failure errors in the sandboxed AI Studio preview environment
      window.addEventListener('unhandledrejection', (event) => {
        const reasonStr = event.reason ? String(event.reason.message || event.reason) : '';
        if (isBenignError(reasonStr)) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);

      window.addEventListener('error', (event) => {
        const errorMsg = event.message || '';
        if (isBenignError(errorMsg) || errorMsg === 'Script error.') {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
